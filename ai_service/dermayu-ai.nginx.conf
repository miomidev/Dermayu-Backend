# ------------------------------------------------------------
# [www.dermayu-ai.miomidev.com], dermayu-ai.miomidev.com
# ------------------------------------------------------------

map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "172.17.0.1";
  set $port           8000;

  listen 80;
  listen [::]:80;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name [www.dermayu-ai.miomidev.com] dermayu-ai.miomidev.com;

  http2 on;

  # Custom Cloudflare Wildcard SSL
  ssl_certificate /data/custom_ssl/npm-13/fullchain.pem;
  ssl_certificate_key /data/custom_ssl/npm-13/privkey.pem;

  # Block Exploits
  include conf.d/include/block-exploits.conf;

  # Force SSL
  set $trust_forwarded_proto "F";
  include conf.d/include/force-ssl.conf;

  access_log /data/logs/dermayu_ai_access.log proxy;
  error_log /data/logs/dermayu_ai_error.log warn;

  location / {
    include conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}

