services:
  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: dermayu-next-app
    restart: always
    env_file:
      - .env
    ports:
      - "8082:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${NEXT_PUBLIC_GOOGLE_REDIRECT_URI}
      - AI_SERVICE_URL=http://ai:8000
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - ai
    networks:
      - dermayu_network
    volumes:
      - dermayu_uploads:/app/public/uploads

  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: dermayu-ai-service
    restart: always
    environment:
      - AI_INTERNAL_KEY=${AI_INTERNAL_KEY:-internal_ai_secret_key_dermayu}
    networks:
      - dermayu_network

  migrator:
    build:
      context: .
      target: builder
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: npx prisma db push --accept-data-loss
    networks:
      - dermayu_network

  seeder:
    build:
      context: .
      target: builder
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: npm run db:seed
    networks:
      - dermayu_network

networks:
  dermayu_network:
    driver: bridge

volumes:
  dermayu_uploads:
